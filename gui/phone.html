<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#181820">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<title>Laudi Remote</title>
<style>
  :root { --bg:#181820; --card:#22222e; --line:#33334a; --text:#f2f2f7; --dim:#9a9ab0; --green:#3ec46d; --red:#e05a5a; --blue:#5a63d6; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 16px 16px 40px; }
  h1 { font-size: 22px; margin: 4px 0 14px; display:flex; align-items:center; gap:10px; }
  .dot { width:14px; height:14px; border-radius:50%; background:var(--dim); box-shadow:0 0 0 0 currentColor; }
  .on .dot { background:var(--green); color:var(--green); animation: pulse 1.6s infinite; }
  .off .dot { background:var(--red); color:var(--red); }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(62,196,109,.6)} 100%{box-shadow:0 0 0 14px rgba(62,196,109,0)} }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:14px; }
  .row { display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; }
  .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  button { border:0; border-radius:12px; padding:14px 8px; font-size:15px; font-weight:600; color:#fff; background:#3a3d58; transition: transform .1s, filter .2s; }
  button:active { transform: scale(.95); filter:brightness(1.3); }
  button:disabled { opacity:.35; }
  .start { background:var(--green); } .stop { background:var(--red); } .restart { background:var(--blue); }
  #log { font: 12px/1.35 ui-monospace, Consolas, monospace; white-space:pre-wrap; word-break:break-word; max-height: 300px; overflow:auto; color:#b4ffc8; background:#0e0e14; border-radius:10px; padding:10px; }
  input { width:100%; padding:13px; border-radius:12px; border:1px solid var(--line); background:#121219; color:var(--text); font-size:16px; }
  .say { display:flex; gap:8px; } .say button { flex: 0 0 90px; }
  #toast { position:fixed; left:16px; right:16px; bottom:16px; background:var(--blue); padding:12px; border-radius:12px; text-align:center; font-weight:600; transform: translateY(120px); transition: transform .3s; }
  #toast.show { transform: translateY(0); }
  .muted { color:var(--dim); font-size:13px; }
  #login { display:none; }
</style>
</head>
<body>
  <div id="login" class="card">
    <h1>🔒 Laudi Remote</h1>
    <p class="muted">Type the PIN shown in Laudi Control on the PC (Phone tab).</p>
    <input id="pin" inputmode="numeric" placeholder="PIN" autocomplete="off">
    <p><button class="restart" style="width:100%" onclick="savePin()">Connect</button></p>
  </div>

  <div id="app" style="display:none">
    <h1 id="title"><span class="dot"></span><span id="state">Connecting…</span></h1>
    <div class="card row">
      <button class="start" id="bStart" onclick="cmd('start')">▶ Start</button>
      <button class="stop" id="bStop" onclick="cmd('stop')">■ Stop</button>
      <button class="restart" id="bRestart" onclick="cmd('restart')">↻ Restart</button>
    </div>
    <div class="card grid2">
      <button onclick="cmd('vid')">🎬 Send me a vid</button>
      <button onclick="cmd('post-now')">📤 Post TikTok</button>
      <button onclick="cmd('hi')">💬 Text me</button>
      <button onclick="cmd('health')">🩺 Health</button>
      <button onclick="cmd('elring')">📞 Call (Element)</button>
      <button onclick="cmd('ring')">📞 Call (Discord)</button>
      <button onclick="cmd('hangup')">📴 Hang up</button>
      <button onclick="cmd('update')">⬇ Update Laudi</button>
    </div>
    <div class="card">
      <div class="say"><input id="say" placeholder="Make him say this on TikTok…"><button class="restart" onclick="say()">Send</button></div>
    </div>
    <div class="card">
      <div class="muted" style="margin-bottom:6px">Live log</div>
      <div id="log">…</div>
    </div>
    <p class="muted">PC: <span id="pc"></span> · <a href="#" style="color:var(--dim)" onclick="logout()">change PIN</a></p>
  </div>
  <div id="toast"></div>

<script>
  let PIN = '';
  try { PIN = localStorage.getItem('laudiPin') || ''; } catch (e) {}
  const $ = (id) => document.getElementById(id);
  function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2500); }
  function savePin() { PIN = $('pin').value.trim(); try { localStorage.setItem('laudiPin', PIN); } catch (e) {} show(); refresh(); }
  function logout() { try { localStorage.removeItem('laudiPin'); } catch (e) {} PIN = ''; show(); return false; }
  function show() { $('login').style.display = PIN ? 'none' : 'block'; $('app').style.display = PIN ? 'block' : 'none'; }
  async function api(path, extra) {
    const r = await fetch(`/api/${path}?pin=${encodeURIComponent(PIN)}${extra || ''}`, { cache: 'no-store' });
    if (r.status === 401) { toast('Wrong PIN'); logout(); throw new Error('pin'); }
    return r.json();
  }
  async function refresh() {
    if (!PIN) return;
    try {
      const s = await api('status');
      $('title').className = s.running ? 'on' : 'off';
      $('state').textContent = s.running ? 'Laudi is running' : 'Laudi is stopped';
      $('bStart').disabled = s.running; $('bStop').disabled = !s.running; $('bRestart').disabled = !s.running;
      const log = $('log'); const atBottom = log.scrollTop + log.clientHeight > log.scrollHeight - 30;
      log.textContent = s.log; if (atBottom) log.scrollTop = log.scrollHeight;
      $('pc').textContent = s.pc || '';
    } catch (e) {
      if (e.message !== 'pin') { $('title').className = ''; $('state').textContent = "Can't reach the PC"; }
    }
  }
  async function cmd(c) {
    try { const r = await api('cmd', `&c=${encodeURIComponent(c)}`); toast(r.ok ? r.msg || 'Done' : r.error || 'Failed'); setTimeout(refresh, 800); }
    catch (e) { if (e.message !== 'pin') toast("Can't reach the PC"); }
  }
  async function say() { const t = $('say').value.trim(); if (!t) return; $('say').value = ''; try { const r = await api('cmd', `&c=say&t=${encodeURIComponent(t)}`); toast(r.ok ? 'Sent' : r.error); } catch (e) {} }
  show(); refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
